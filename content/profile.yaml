# yaml-language-server: $schema=../schema/cv-profile.schema.json
# Tracked template. The contact details below are DELIBERATE PLACEHOLDERS and
# are meant to look obviously fake, so they are unmistakable if one ever reaches
# a rendered PDF.
#
# Put your real email and phone in content/profile.local.yaml, which is
# gitignored. That file shallow-overrides top-level keys here, so it usually
# needs nothing but a `contact:` block. The build prints a warning on every run
# when it is missing.
name:
  en: Chengxuan Li
  zh: 李承轩
anticipated_graduation:
  en: May 2028
  zh: 2028年5月
contact:
  - en: "Email: [you@example.com](mailto:you@example.com)"
    zh: "邮箱：[you@example.com](mailto:you@example.com)"
  - en: "Phone: +1 (555) 000-0000"
    zh: "电话：+1 (555) 000-0000"
  # A public URL is not sensitive, so it lives here rather than in the override.
  # It must be repeated in profile.local.yaml too: that file replaces the whole
  # `contact` list, so anything only listed here is dropped once it exists.
  - en: "Website: [chengxuan-li.github.io](https://chengxuan-li.github.io)"
    zh: "个人网站：[chengxuan-li.github.io](https://chengxuan-li.github.io)"
# A list: the first tagline passing both gates wins. Put targeted lines above
# the unmarked fallback.
tagline:
  - en: "PhD Candidate, Systems Engineering (Minor: Electrical and Computer Engineering), Cornell University"
    zh: "康奈尔大学系统工程博士候选人（辅修电气与计算机工程）"
